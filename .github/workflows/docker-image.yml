name: Build backend image and update GitOps

# BE 저장소의 master 브랜치에 코드가 push되면 이 워크플로를 실행한다.
on:
  push:
    branches: [master]

env:
  # 컨테이너 이미지를 저장할 GitHub Container Registry 주소
  REGISTRY: ghcr.io
  # BE 컨테이너 이미지 이름
  IMAGE_NAME: joongsunyoon/ktb_homework_community
  # Kubernetes YAML을 관리하는 GitOps 저장소와 대상 브랜치
  GITOPS_REPOSITORY: joongsunYoon/community
  GITOPS_BRANCH: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN으로 소스 코드를 읽고 GHCR에 이미지를 올리는 데 필요한 권한이다.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # 이미지 빌드에 사용할 BE 소스 코드를 내려받는다.
      - name: Checkout backend repository
        uses: actions/checkout@v6

      # 여러 플랫폼을 지원하는 Docker 빌드 환경을 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub가 제공하는 GITHUB_TOKEN으로 GHCR에 로그인한다.
      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 동일한 이미지에 커밋 SHA 태그와 master 태그를 함께 붙여 GHCR에 올린다.
      # Kubernetes에서는 변경 여부가 명확한 SHA 태그를 사용한다.
      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          platforms: linux/amd64
          # 첫 줄은 실제 배포용 SHA 태그, 둘째 줄은 최근 master 확인용 태그이다.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master

      # 만들어진 이미지가 이 GitHub Actions 실행에서 생성됐다는 증명 정보를 등록한다.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # 별도 저장소인 community를 수정하려면 GITOPS_TOKEN이 필요하다.
      # BE 저장소 Settings > Secrets and variables > Actions에 등록해야 한다.
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      # Deployment의 기존 BE 이미지 태그를 이번 BE 커밋 SHA로 교체한다.
      # grep은 실제로 교체됐는지 검사하며, 교체되지 않았다면 작업을 실패시킨다.
      - name: Update backend image in GitOps
        working-directory: gitops
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i -E "s#image: ghcr.io/joongsunyoon/ktb_homework_community:[^[:space:]]+#image: ${IMAGE}#" templates/deployment-backend.yaml
          grep -F "image: ${IMAGE}" templates/deployment-backend.yaml

      # 변경된 Deployment를 community 저장소 main 브랜치에 push한다.
      # 이후 Argo CD가 Git 변경을 감지하여 새 BE Pod를 자동 배포한다.
      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/deployment-backend.yaml
          # 같은 SHA가 이미 기록되어 변경사항이 없으면 정상 종료한다.
          git diff --cached --quiet && exit 0
          git commit -m "deploy: update backend to ${{ github.sha }}"
          git pull --rebase origin "${GITOPS_BRANCH}"
          git push origin "HEAD:${GITOPS_BRANCH}"
