name: Build backend image and request deployment

# BE master 브랜치에 코드가 push되면 이미지를 만들고 K8s 저장소에 배포를 요청한다.
on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: joongsunyoon/ktb_homework_community
  # 실제 Kubernetes YAML을 관리하는 GitOps 저장소
  GITOPS_REPOSITORY: joongsunYoon/community

jobs:
  build-and-request-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # BE 소스 코드를 내려받는다.
      - name: Checkout backend repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN은 현재 BE 저장소의 GHCR 이미지 업로드에 사용한다.
      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA 태그는 배포용이고 master 태그는 최근 이미지를 사람이 확인하기 위한 태그다.
      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # BE 저장소는 Kubernetes YAML을 직접 수정하지 않는다.
      # repository_dispatch로 K8s 저장소에 BE 커밋 SHA만 전달한다.
      # GITOPS_TOKEN은 K8s 저장소에 이벤트를 보낼 수 있는 Fine-grained PAT이다.
      - name: Request backend deployment from GitOps repository
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITOPS_REPOSITORY}/dispatches" \
            -f event_type="deploy-backend" \
            -f client_payload[sha]="${GITHUB_SHA}"
